name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Adjust to match your production server if needed
        extensions: mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip
        tools: composer:v2

    - name: Validate composer.json
      run: composer validate --strict

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: PHP Syntax Check (Lint)
      run: find . -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n 1 -P 8 php -l

  deploy:
    name: Continuous Deployment
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deployment Info
      run: |
        echo "Deployment triggered for branch ${GITHUB_REF_NAME}"
        echo "To enable automatic deployment, configure your secrets in GitHub Repository Settings -> Secrets and Variables -> Actions"
        echo "Then setup the FTP-Deploy-Action or SSH Deploy in this workflow file."

    # Example FTP Deployment (Uncomment and configure secrets to use)
